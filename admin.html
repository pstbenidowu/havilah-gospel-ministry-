<style>
body{background:#eef1f6;font-size:15px}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--navy);color:#cfd7e6;padding:20px 14px;position:sticky;top:0;height:100vh}aside img{height:52px;border-radius:6px}aside b{display:block;color:#fff;font-family:'Cormorant Garamond',serif;font-size:1.2rem;margin:8px 0 18px}
aside button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:10px 12px;border-radius:6px;font:inherit;cursor:pointer}aside button.on,aside button:hover{background:#1d3560;color:var(--gold2)}
main{padding:28px;max-width:1000px}h2{font-size:2rem;margin-bottom:16px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.stat b{font-size:2rem;font-family:'Cormorant Garamond',serif;color:var(--navy);display:block}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #e1e5ee}.row>span{flex:1}.row img{width:52px;height:52px;object-fit:cover;border-radius:4px}
.sm{padding:6px 12px;font-size:.85rem;border:0;border-radius:4px;cursor:pointer;font-weight:700}.ok{background:#2e8b57;color:#fff}.no,.del{background:var(--flame);color:#fff}.gh{background:#e1e5ee}
label{display:grid;gap:4px;font-weight:700;font-size:.85rem}.pill{padding:2px 10px;border-radius:12px;font-size:.78rem;font-weight:700}.pending{background:#f7e6b0}.approved{background:#cdeccd}.rejected{background:#f5cccc}
.rep{border:1px solid #dfe4ee;border-radius:6px;padding:16px;margin-bottom:14px;background:#fff}.rep h4{margin:12px 0 2px}.rep p{margin:0;white-space:pre-line}
#login{max-width:380px;margin:12vh auto}table{border-collapse:collapse}td,th{border:1px solid #dfe4ee;padding:4px 10px}

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
if(!window.SUPABASE_URL||window.SUPABASE_URL.includes('YOUR'))document.body.innerHTML='<p style="padding:30px">Open <b>config.js</b> and add your Supabase URL and anon key.</p>';
const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
const KINDS={gallery:{l:'Gallery',file:'image/*',f:[]},audio:{l:'Audio library',file:'audio/*',f:[['speaker','Speaker']]},sermon:{l:'Sermons',file:'video/*',opt:1,f:[['preacher','Preacher'],['description','Summary','t']]},
 devotional:{l:'Daily devotional',f:[['devoDate','Date','date'],['scripture','Scripture'],['body','Message','t'],['prayer','Prayer']]},
 program:{l:'Upcoming programs',file:'image/*',f:[['programDate','Date'],['time','Time'],['venue','Venue']]},book:{l:'Books',file:'image/*',f:[['author','Author'],['price','Price'],['description','Description','t']]}};
const TABS=[['home','Overview'],['reports','Department reports'],['depts','Departments & leaders'],['content','Website content'],['inbox','Inbox']];
const go={home,reports,depts,content,inbox};
$('#lf').onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});if(error)return $('#lm').textContent=error.message;enter()};
async function enter(){const {data:{session}}=await sb.auth.getSession();if(!session)return;const {data:ok}=await sb.rpc('is_admin');
 if(!ok){await sb.auth.signOut();$('#lm').textContent='This account is not an administrator.';return}
 $('#login').hidden=true;$('#app').hidden=false;$('#nav').innerHTML=TABS.map(([k,l])=>`<button data-k="${k}">${l}</button>`).join('');show('home')}
$('#nav').onclick=e=>e.target.dataset.k&&show(e.target.dataset.k);$('#out').onclick=async()=>{await sb.auth.signOut();location.reload()};
function show(k){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));go[k]()}
const cnt=(t,q)=>{let r=sb.from(t).select('*',{count:'exact',head:true});return q?q(r).then(x=>x.count||0):r.then(x=>x.count||0)};

async function home(){const [p,pr,t,j]=await Promise.all([cnt('department_reports',r=>r.eq('status','pending')),cnt('submissions',r=>r.eq('kind','prayer')),cnt('submissions',r=>r.eq('kind','testimony').eq('approved',false)),cnt('submissions',r=>r.eq('kind','join'))]);
 $('#main').innerHTML=`<h2>Overview</h2><div class="stats"><div class="card stat"><b>${p}</b>Reports awaiting approval</div><div class="card stat"><b>${pr}</b>Prayer requests</div><div class="card stat"><b>${t}</b>Testimonies to review</div><div class="card stat"><b>${j}</b>Department join requests</div></div>`}

async function reports(){const {data}=await sb.from('department_reports').select('*, departments(name)').order('created_at',{ascending:false});
 $('#main').innerHTML='<h2>Department reports</h2><p class="meta noprint">Only you can see these reports.</p>'+((data||[]).map(r=>{const tot=(r.attendance||[]).reduce((a,x)=>a+x.count,0);return `<div class="rep"><b style="font-size:1.2rem">${esc(r.departments?.name)}</b> · ${esc(r.month)} <span class="pill ${r.status}">${r.status}</span><p class="meta">Leader: ${esc(r.leader_name)} · Submitted ${fmt(r.created_at)}</p>
 <h4>Attendance / participation (total ${tot})</h4><table>${(r.attendance||[]).map(x=>`<tr><td>${fmt(x.date)}</td><td>${x.count}</td></tr>`).join('')||'<tr><td>No figures</td></tr>'}</table>
 <h4>Activities</h4><p>${esc(r.activities)}</p><h4>Meetings</h4><p>${esc(r.meetings)}</p><h4>Needs of the unit</h4><p>${esc(r.needs)}</p><h4>Challenges and prayer points</h4><p>${esc(r.challenges)}</p>${r.admin_note?`<h4>Your note</h4><p>${esc(r.admin_note)}</p>`:''}
 <p class="noprint" style="margin-top:12px"><button class="sm ok" data-s="approved" data-i="${r.id}">Approve</button> <button class="sm no" data-s="rejected" data-i="${r.id}">Reject</button> <button class="sm gh" onclick="print()">Print</button> <button class="sm del" data-x="${r.id}">Delete</button></p></div>`}).join('')||'<p class="empty">No reports yet.</p>');
 $('#main').onclick=async e=>{const d=e.target.dataset;if(d.s){const note=prompt('Note to the leader (optional)')??'';await sb.from('department_reports').update({status:d.s,admin_note:note||null,reviewed_at:new Date().toISOString()}).eq('id',d.i);reports()}else if(d.x&&confirm('Delete this report permanently?')){await sb.from('department_reports').delete().eq('id',d.x);reports()}}}

async function depts(){const {data}=await sb.from('departments').select('*').order('name');
 $('#main').innerHTML=`<h2>Departments & leaders</h2><div class="cols"><div class="card"><h3>Add a department</h3><form id="df"><label>Name<input id="dn" required></label><label>Description<textarea id="dd"></textarea></label><label>Leader's name<input id="dl"></label><button class="btn">Add department</button></form></div>
 <div class="card"><h3>Departments</h3><p class="meta">Set a different password for each leader. Passwords are stored encrypted and cannot be viewed later, only replaced.</p>${(data||[]).map(x=>`<div class="row"><span><b>${esc(x.name)}</b><br><small>${esc(x.leader_name||'No leader set')}</small></span><button class="sm gh" data-p="${x.id}">Set password</button><button class="sm del" data-x="${x.id}">Delete</button></div>`).join('')}</div></div>`;
 $('#df').onsubmit=async e=>{e.preventDefault();await sb.from('departments').insert({name:$('#dn').value,description:$('#dd').value,leader_name:$('#dl').value});depts()};
 $('#main').onclick=async e=>{const d=e.target.dataset;if(d.p){const pw=prompt('New password for this department leader (min 6 characters)');if(pw){const {error}=await sb.rpc('set_leader_password',{p_dept:d.p,p_password:pw});alert(error?error.message:'Password saved. Share it privately with the leader.')}}else if(d.x&&confirm('Delete this department and all its reports?')){await sb.from('departments').delete().eq('id',d.x);depts()}}}

let ck='gallery';
async function content(){const K=KINDS[ck];const {data}=await sb.from('items').select('*').eq('kind',ck).order('created_at',{ascending:false});
 $('#main').innerHTML=`<h2>Website content</h2><div class="noprint" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">${Object.entries(KINDS).map(([k,v])=>`<button class="sm ${k===ck?'ok':'gh'}" data-k="${k}">${v.l}</button>`).join('')}</div>
 <div class="cols"><div class="card"><h3>Add to ${K.l}</h3><form id="cf"><label>Title<input id="ct" required></label>${K.f.map(([n,l,t])=>`<label>${l}${t==='t'?`<textarea data-n="${n}"></textarea>`:`<input data-n="${n}" type="${t||'text'}">`}</label>`).join('')}${K.file?`<label>${K.opt?'File (optional)':'File'}<input type="file" id="cfile" accept="${K.file}" ${K.opt?'':'required'}></label>`:''}<button class="btn">Publish</button><span class="msg" id="cm"></span></form></div>
 <div class="card"><h3>Published</h3>${(data||[]).map(i=>`<div class="row">${i.file_url&&ck!=='audio'&&ck!=='sermon'?`<img src="${esc(i.file_url)}" alt="">`:''}<span><b>${esc(i.title)}</b><br><small>${fmt(i.created_at)}</small></span><button class="sm del" data-x="${i.id}" data-u="${esc(i.file_url||'')}">Delete</button></div>`).join('')||'<p class="empty">Nothing yet.</p>'}</div></div>`;
 $('#cf').onsubmit=async e=>{e.preventDefault();$('#cm').textContent='Uploading…';let url=null;const f=$('#cfile')?.files[0];
  if(f){const path=`${ck}/${Date.now()}-${f.name.replace(/[^\w.\-]/g,'_')}`;const up=await sb.storage.from('media').upload(path,f);if(up.error)return $('#cm').textContent=up.error.message;url=sb.storage.from('media').getPublicUrl(path).data.publicUrl}
  const dt={};document.querySelectorAll('#cf [data-n]').forEach(x=>dt[x.dataset.n]=x.value);
  const {error}=await sb.from('items').insert({kind:ck,title:$('#ct').value,data:dt,file_url:url});if(error)return $('#cm').textContent=error.message;content()};
 $('#main').onclick=async e=>{const d=e.target.dataset;if(d.k){ck=d.k;content()}else if(d.x&&confirm('Delete this item?')){if(d.u){const p=d.u.split('/media/')[1];if(p)await sb.storage.from('media').remove([decodeURIComponent(p)])}await sb.from('items').delete().eq('id',d.x);content()}}}

let ik='prayer';
async function inbox(){const {data}=await sb.from('submissions').select('*').eq('kind',ik).order('created_at',{ascending:false});
 $('#main').innerHTML=`<h2>Inbox</h2><div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">${[['prayer','Prayer requests'],['testimony','Testimonies'],['join','Department joins'],['partnership','Partners'],['contact','Messages']].map(([k,l])=>`<button class="sm ${k===ik?'ok':'gh'}" data-k="${k}">${l}</button>`).join('')}</div><div class="card">${(data||[]).map(i=>`<div class="row" style="align-items:flex-start"><span><b>${esc(i.name)}</b> <small>${fmt(i.created_at)}</small><br>${esc(i.message||'')}<br><small>${esc([i.phone,i.email,i.extra?.type,i.extra?.department].filter(Boolean).join(' · '))}</small></span>${ik==='testimony'?`<button class="sm ${i.approved?'gh':'ok'}" data-a="${i.id}" data-v="${i.approved}">${i.approved?'Unpublish':'Publish'}</button>`:''}<button class="sm del" data-x="${i.id}">Delete</button></div>`).join('')||'<p class="empty">Nothing here yet.</p>'}</div>`;
 $('#main').onclick=async e=>{const d=e.target.dataset;if(d.k){ik=d.k;inbox()}else if(d.a){await sb.from('submissions').update({approved:d.v!=='true'}).eq('id',d.a);inbox()}else if(d.x&&confirm('Delete?')){await sb.from('submissions').delete().eq('id',d.x);inbox()}}}
enter();
</script></body></html>
